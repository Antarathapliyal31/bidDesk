[project]
name = "biddesk-backend"
version = "0.1.0"
description = "BidDesk backend — LBM bid generation from RFPs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "aiosqlite>=0.20",
    "anthropic>=0.39",
    "pdfplumber>=0.11",
    "pypdfium2==4.30.0",  # pinned: rasterization output is deterministic for fixed (input, DPI, build)
    "pint>=0.24",
    "sse-starlette>=2.1",
    "pyyaml>=6.0",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line-length is enforced by `ruff format`, not by lint

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# Unit normalization deliberately handles en/em dashes, unicode superscripts,
# and fullwidth letters; RUF001/RUF002/RUF003 would flag those as typos.
"app/catalog/units.py" = ["RUF001", "RUF002", "RUF003"]
"tests/catalog/test_units.py" = ["RUF001", "RUF002", "RUF003"]
# Seed display names use the unicode × multiplication sign on purpose
# (lumber dimensions, sheet sizes); RUF001/RUF003 would flag them.
"app/catalog/seed.py" = ["RUF001", "RUF003"]
# bid.py uses × and ≠ in docstrings / error messages / comments for
# arithmetic identities (extended_cents = sale_qty × unit_price_cents);
# RUF001/RUF002/RUF003 would flag those as typos.
"app/contracts/bid.py" = ["RUF001", "RUF002", "RUF003"]
# common.py uses ⇄ in docstring; same justification.
"app/contracts/common.py" = ["RUF002"]
# BidLine test docstrings mirror the invariant text (× in math
# identities); same justification.
"tests/contracts/test_bid_line_invariants.py" = ["RUF001", "RUF002", "RUF003"]
# Analyst verify.py deliberately rewrites unicode quotes / dashes /
# fractions (NFKC, curly→straight, en/em→hyphen) as part of the
# quote-match normalizer. RUF would flag the source characters.
"app/agents/analyst/verify.py" = ["RUF001", "RUF003"]
# Routing test uses an en-dash on purpose to exercise normalization.
"tests/agents/analyst/test_verify.py" = ["RUF001"]
# Sample content uses the unicode × multiplication sign too (lumber
# dimensions in the mock RFPs); same justification.
"../samples/make_samples.py" = ["RUF001", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
